meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  skip: false
  # npm install выполняется автоматически; здесь добавляем сборку Next.js и TypeScript-воркера
  additionalCommands: npm run build
  artifacts:
    "*": /
run:
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  # Запускаем кастомный сервер с Socket.IO (не стандартный next start)
  command: npx tsx server.js
  persistenceMount: /data
  # Приложение слушает PORT (по умолчанию 3000) — задайте PORT=3000 в переменных окружения Amvera
  containerPort: "3000"
  servicePort: "3000"
