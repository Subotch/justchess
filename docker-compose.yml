version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: justchess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: justchess
      POSTGRES_PASSWORD: justchess_secret_pass
      POSTGRES_DB: justchess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justchess -d justchess"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
