meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  skip: false
  # additionalCommands: npm run build // Закомментировано — сборка происходит автоматически, дублирование вызывает таймаут
  artifacts:
    "*": /
run:
  scriptName: null
  scriptArguments: null
  nodeArguments: --max-old-space-size=1024 # Лимит памяти для Node.js (1GB)
  # Запускаем кастомный сервер с Socket.IO (не стандартный next start)
  command: npx tsx server.js
  persistenceMount: /data
  # Приложение слушает PORT (по умолчанию 3000) — задайте PORT=3000 в переменных окружения Amvera
  # Важно: установите NODE_ENV=production в переменных окружения Amvera Cloud
  containerPort: "3000"
  servicePort: "3000"
