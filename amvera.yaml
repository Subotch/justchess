meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  skip: false
  additionalCommands: |
    NODE_OPTIONS="--max-old-space-size=2048" npm run build
  artifacts:
    "*": /
run:
  scriptName: null
  scriptArguments: null
  nodeArguments: --max-old-space-size=1024
  command: npx tsx server.js
  persistenceMount: /data
  containerPort: "3000"
  servicePort: "3000"
